<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon untuk tab browser -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/sr-blue.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/sr-blue.png" />

    <!-- iOS homescreen icon -->
    <link rel="apple-touch-icon" href="/icons/sr-blue.png" />

    <!-- PWA manifest disuntik otomatis oleh vite-plugin-pwa sebagai
         /manifest.webmanifest — jangan tambah <link rel="manifest"> manual
         di sini, nanti jadi dobel dan yang manual menang tapi 404. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SR Agency</title>

    <!-- Tema dipasang SEBELUM CSS & React supaya tidak berkedip warna tema
         yang salah. Logika harus sama dengan tentukanTema/normalkanPilihan di
         src/lib/tema.ts (kunci localStorage 'sr-tema'; bawaan ikuti sistem). -->
    <script>
      (function () {
        var p = 'sistem';
        try { p = localStorage.getItem('sr-tema') || 'sistem'; } catch (e) {}
        if (p !== 'terang' && p !== 'gelap') p = 'sistem';
        var gelap = p === 'gelap' || (p === 'sistem' &&
          !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches));
        if (!gelap) document.documentElement.setAttribute('data-theme', 'light');
        window.__srTemaAwal = gelap ? '#0e0e10' : '#f4f5f7';
      })();
    </script>

    <!-- Anti kedip: latar sesuai tema sebelum stylesheet utama termuat. -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0e0e10;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      html[data-theme='light'], html[data-theme='light'] body {
        background-color: #f4f5f7;
        color: #16181d;
      }
    </style>

    <!-- Warna status bar HP — diperbarui ke tema aktif oleh terapkanTema(). -->
    <meta name="theme-color" content="#0e0e10" />
    <script>
      document.querySelector('meta[name="theme-color"]').setAttribute('content', window.__srTemaAwal);
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SR Agency" />

    <!-- Setara apple-mobile-web-app-capable, untuk Chrome/Android -->
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
