<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon untuk tab browser -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/sr-blue.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/sr-blue.png" />

    <!-- iOS homescreen icon -->
    <link rel="apple-touch-icon" href="/icons/sr-blue.png" />

    <!-- PWA manifest disuntik otomatis oleh vite-plugin-pwa sebagai
         /manifest.webmanifest — jangan tambah <link rel="manifest"> manual
         di sini, nanti jadi dobel dan yang manual menang tapi 404. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SR Agency</title>

    <!-- Anti-kedip. Nilainya harus sama dengan token tema, tapi ditulis
         harfiah karena berjalan sebelum CSS aplikasi termuat. Tumpukan font
         sengaja identik dengan --font-sans supaya huruf tidak bergeser antara
         paint pertama dan setelah CSS masuk. -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        /* Bawaan gelap — script di bawah menimpanya jadi terang kalau
           pengguna memang memilih terang. Urutan ini dibalik dari sebelumnya
           supaya pemuatan pertama tidak berkedip putih. */
        background-color: #0f172a;
        color: #f8fafc;
        font-family: 'Inter Variable', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      html[data-theme='light'], html[data-theme='light'] body {
        background-color: #ffffff;
        color: #101828;
      }
    </style>

    <!-- Menentukan tema SEBELUM paint pertama supaya tidak ada kedip
         terang/gelap saat aplikasi dibuka. Aturannya harus sama persis
         dengan src/lib/theme.ts — kunci 'sr-theme' dijaga oleh test di
         src/lib/theme.test.ts. Sengaja ditulis inline & tanpa modul:
         apa pun yang di-import baru jalan setelah paint. -->
    <script>
      (function () {
        var html = document.documentElement;
        try {
          var pref = localStorage.getItem('sr-theme');
          // Bawaan 'dark', bukan 'system' — gelap adalah identitas aplikasi
          // ini. Harus sama dengan BAWAAN di src/lib/theme.ts.
          if (pref !== 'light' && pref !== 'system') pref = 'dark';
          var gelap =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          html.setAttribute('data-theme', gelap ? 'dark' : 'light');

          // Bilah status browser/PWA. Meta TANPA atribut media menang atas
          // yang bermedia di bawah, jadi pilihan manual pengguna tetap
          // dihormati — bukan sekadar mengikuti preferensi sistem.
          var meta = document.querySelector('meta[name="theme-color"]:not([media])');
          if (!meta) {
            meta = document.createElement('meta');
            meta.setAttribute('name', 'theme-color');
            document.head.appendChild(meta);
          }
          meta.setAttribute('content', gelap ? '#0f172a' : '#ffffff');
        } catch (e) {
          // localStorage melempar di mode privat / cookie diblokir.
          html.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <!-- ✅ Fix neon Safari + iOS bar.
         Dua baris sesuai preferensi sistem; script di atas menambahkan satu
         meta tanpa media yang menimpa keduanya saat pengguna memilih manual. -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SR Agency" />

    <!-- Setara apple-mobile-web-app-capable, untuk Chrome/Android -->
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
